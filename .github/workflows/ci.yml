# Integración continua: antes de que algo llegue a producción, se compila, se
# revisa y se corren todos los tests.
#
# Render despliega solo cuando main recibe un push. Con «Auto-Deploy: After CI
# Checks Pass» en Render, un push que rompe los tests no se publica.
#
# No usa ningún secreto ni ninguna base real: los e2e corren contra un Prisma
# en memoria (test/prisma-en-memoria.ts), y los de integración contra un
# Postgres vacío que GitHub levanta para esta corrida y después tira.
# Nunca toca producción.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Un Postgres vacío solo para los tests de integración. Nace y muere con
    # esta corrida; no tiene nada que ver con la base de producción.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantenimiento_integracion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo: hace falta para revisar los commits nuevos.
          fetch-depth: 0

      - name: Formato de los commits
        # Solo los commits nuevos (los del pull request, o los del push), con el
        # formato de CONTRIBUTING.md. El historial viejo no se revisa.
        env:
          DESDE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HASTA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$DESDE" ] || [ "$DESDE" = "0000000000000000000000000000000000000000" ]; then
            DESDE="$HASTA~1"
          fi
          node scripts/verificar-commits.mjs "$DESDE..$HASTA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Validar el esquema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci/ci
          DIRECT_URL: postgresql://ci/ci

      - name: Revisar el código (lint)
        # Sin --fix: en CI se revisa, no se corrige. Las advertencias no cortan.
        run: npx eslint "{src,prisma,test}/**/*.ts"

      - name: Compilar
        run: npx tsc --noEmit -p tsconfig.json

      # Los tests van por los scripts de package.json: Jest 30 necesita que Node
      # arranque con --experimental-vm-modules para cargar NestJS 12, que viene
      # como ESM, y la opción está definida ahí una sola vez.
      - name: Tests unitarios
        run: npm test -- --ci

      - name: Tests de punta a punta
        run: npm run test:e2e -- --ci

      - name: Tests de integración (Postgres real, vacío)
        # Aplica las migraciones a la base del servicio de arriba y prueba el
        # calendario, los planes y los trabajos con consultas de verdad.
        run: npm run test:integracion -- --ci
        env:
          INTEGRACION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mantenimiento_integracion
