# Blueprint de Render para la API (NestJS + Prisma).
# Los secretos (sync: false) se cargan en el dashboard de Render, NO acá.
services:
  - type: web
    name: mantenimiento2-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev: Render usa NODE_ENV=production y sin esto no instala las
    # devDependencies (nest-cli, typescript, prisma) necesarias para compilar.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /docs
    envVars:
      - key: AUTH_DISABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      # ── Envío automático de órdenes por correo ──
      # Render BLOQUEA los puertos SMTP salientes: el envío va por la API HTTP
      # de Brevo. Las SMTP_* quedan para desarrollo local.
      - key: BREVO_API_KEY
        sync: false
      # Si faltan, el envío automático queda apagado y el sistema sigue
      # ofreciendo el envío manual.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: mantenimiento.lastres@gmail.com
      # Contraseña de aplicación de Gmail (16 caracteres). Se carga en el
      # dashboard de Render, nunca acá.
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: mantenimiento@lacteoslastres.com.ar
      # ── Fotos de los equipos ──
      # La service_role da acceso total a la base: se carga en el dashboard de
      # Render, nunca acá.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: equipos
      - key: MAIL_ADMINISTRACION
        value: administracion@lacteoslastres.com.ar
      # ── Avisos de mantenimiento ──
      # Casilla fija que recibe el correo diario de services que vencen, además
      # de los administradores.
      - key: MAIL_AVISOS
        value: mantenimiento@lacteoslastres.com.ar
      # Secreto que autoriza a disparar el envío. El MISMO valor va en el secret
      # TOKEN_AVISOS del repositorio, que es de donde sale el cron: el plan
      # gratuito apaga el servidor y un cron interno no se ejecutaría.
      # Si falta, el endpoint queda cerrado y no se manda ningún aviso.
      - key: TOKEN_AVISOS
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
